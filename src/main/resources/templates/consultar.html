
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contenidos Relacionados</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet"
          th:href="@{/consultas.css}">
</head>

<body>

<div class="container py-5">

    <!-- ENCABEZADO -->
    <div class="text-center text-white mb-5">

        <div class="display-5 mb-3">
            📚
        </div>

        <h1 class="fw-bold">
            Contenidos Relacionados
        </h1>

        <p class="lead opacity-75">
            Explora diferentes contenidos sobre tecnología,
            desarrollo y datos.
        </p>

    </div>


    <!-- CONTENEDOR DE TARJETAS -->
    <div class="row g-4">

        <!-- TARJETA -->
        <div class="col-12 col-md-6 col-lg-4"
             th:each="contenido : ${contenidos}">

            <div class="card h-100 border-0 shadow-lg contenido-card">

                <!-- CABECERA DE LA TARJETA -->
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between
                                align-items-start mb-3">

                        <div class="icono-contenido">
                            📖
                        </div>

                        <span class="badge rounded-pill bg-primary">
                            Tecnología
                        </span>

                    </div>


                    <!-- TITULO -->
                    <h2 class="card-title h5 fw-bold"
                        th:text="${contenido.titulo}">
                        Título del contenido
                    </h2>


                    <!-- DESCRIPCION -->
                    <p class="card-text text-secondary mt-3"
                       th:text="${contenido.descripcion}">
                        Descripción del contenido.
                    </p>

                    <!-- PALABRAS CLAVE -->
                    <div class="mt-4">

                        <small class="text-muted d-block mb-2">
                            Palabras clave
                        </small>

                        <span class="badge text-bg-light border me-1">
                            Backend
                        </span>

                        <span class="badge text-bg-light border me-1">
                            Java
                        </span>

                        <span class="badge text-bg-light border">
                            Desarrollo
                        </span>

                    </div>

                </div>
            </div>

        </div>

    </div>

</div>


<div class="text-center">
    <a th:href="@{/regresar}" class="text-decoration-none">
        <div class="card-salir mb-2">
            <span class="fs-3">⬅️</span>
            <p class="mb-0">Regresar a la página principal</p>
        </div>
    </a>
</div>




<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
